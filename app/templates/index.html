<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question BOT</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #ece9e6, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .logout-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .logout-button {
            background-color: #dc3545;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-button:hover {
            background-color: #b02a37;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1em;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
        }

        .correct {
            color: green;
            background: #eaffea;
            border: 1px solid green;
        }

        .incorrect {
            color: red;
            background: #ffeaea;
            border: 1px solid red;
        }
    </style>
</head>
<body>

<!-- Logout Button -->
<div class="logout-container">
    <button class="logout-button" onclick="window.location.href='/logout'">Logout</button>
</div>

<div class="container">
    <h1>IITM Inc. Question BOT</h1>
    <form id="selection-form">
        <div class="form-group">
            <label>Student ID:</label>
            <input type="text" id="student-id" placeholder="Enter Student ID" required>
        </div>
        <div class="form-group">
            <label>Subject:</label>
            <select id="subject" required>
                <option value="" disabled selected>Select a subject</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Chemistry">Chemistry</option>
            </select>
        </div>

        <div class="form-group">
            <label>Topic:</label>
            <select id="topic" required>
                <option value="" disabled selected>Select a topic</option>
            </select>
        </div>

        <div class="form-group">
            <label>Level of Question:</label>
            <select id="level" required>
                <option value="" disabled selected>Select difficulty level</option>
                <option value="Basic">Basic</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>
        </div>

        <div class="form-group">
            <label>Number of Questions:</label>
            <input type="number" id="num-questions" min="1" max="25" placeholder="Enter number of questions" required>
        </div>
        
        <button type="button" id="assign-button">Assign Questions</button>
    </form>

    <div class="result" id="result"></div>
</div>

<script>
// Handle subject selection and populate topics
const subjectSelect = document.getElementById('subject');
const topicSelect = document.getElementById('topic');
subjectSelect.addEventListener('change', function () {
    topicSelect.innerHTML = '<option value="" disabled selected>Select a topic</option>';

    const topics = {
        'Mathematics': ['Circles', 'Linear Equations', 'Probability', 'Sets'],
        'Physics': ['Optics', 'Thermodynamics', 'Electromagnetism', 'Radioactivity'],
        'Chemistry': ['Chemical Reactions', 'Periodic Table', 'Organic Chemistry']
    };

    (topics[this.value] || []).forEach(topic => {
        const option = document.createElement('option');
        option.value = topic;
        option.textContent = topic;
        topicSelect.appendChild(option);
    });
});

// Assign Questions to Students and Display Results
const assignButton = document.getElementById('assign-button');
assignButton.addEventListener('click', () => {
    const studentId = document.getElementById('student-id').value;
    const subject = document.getElementById('subject').value;
    const topic = document.getElementById('topic').value;
    const level = document.getElementById('level').value;
    const numQuestions = parseInt(document.getElementById('num-questions').value, 10);

    if (!studentId || !subject || !topic || !level || !numQuestions) {
        alert("Please fill all the fields correctly.");
        return;
    }

    fetch('/generate_question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ studentId, subject, topic, level, numQuestions })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            document.getElementById('result').innerHTML = `<p class="result incorrect">${data.error}</p>`;
        } else {
            document.getElementById('result').innerHTML = `<p class="result correct">Assigned questions successfully!</p>`;
        }
    })
    .catch(error => {
        console.error("Error assigning questions:", error);
        document.getElementById('result').innerHTML = `<p class="result incorrect">Error assigning questions. Please try again.</p>`;
    });
});
</script>

</body>
</html>
