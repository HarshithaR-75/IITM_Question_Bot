<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate and Assign Test</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="position-fixed top-0 end-0 p-3">
      <a href="{{ url_for('routes.logout') }}" class="btn btn-outline-danger">Logout</a>
    </div>

    <h2 class="mb-4">Generate & Assign Test</h2>

    <form id="questionForm">
      <div class="mb-3">
        <label for="studentIds" class="form-label">Select Students</label>
        <div id="studentCheckboxes"></div>
        <div id="studentError" class="text-danger mt-1" style="display: none;">Please select at least one student.</div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="subject" class="form-label">Subject</label>
          <select class="form-select" id="subject" required>
            <option value="">Select Subject</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Mathematics">Mathematics</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="topic" class="form-label">Topic</label>
          <select class="form-select" id="topic" required disabled>
            <option value="">Select Topic</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="level" class="form-label">Difficulty</label>
          <select class="form-select" id="level" required>
            <option value="">Select Difficulty Level</option>
            <option value="Basic">Basic</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="numQuestions" class="form-label">Number of Questions</label>
          <input type="number" class="form-control" id="numQuestions" min="1" required>
        </div>
        <div class="col-md-4">
          <label for="timeLimit" class="form-label">Time Limit (minutes)</label>
          <input type="number" class="form-control" id="timeLimit" min="1" required>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button type="button" class="btn btn-primary w-100" onclick="fetchFilteredQuestions()">Fetch Existing Questions</button>
        </div>
      </div>

      <div class="mb-3">
        <h5>Available Questions</h5>
        <div id="questionsList" class="border p-3 bg-white" style="max-height: 300px; overflow-y: scroll;"></div>
      </div>

      <button type="submit" class="btn btn-success" id="assignBtn" disabled>Assign Test</button>
    </form>

    <div id="responseBox" class="mt-4"></div>
  </div>

  <script>
    // Load student checkboxes
    fetch('/get_students')
      .then(res => res.json())
      .then(data => {
        const studentDiv = document.getElementById('studentCheckboxes');
        data.students.forEach(s => {
          const checkbox = `
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="studentIds" value="${s.id}" id="student_${s.id}">
              <label class="form-check-label" for="student_${s.id}">${s.name}</label>
            </div>`;
          studentDiv.insertAdjacentHTML('beforeend', checkbox);
        });
      });

    const subjectsTopics = {
      Physics: ['Mechanics', 'Electromagnetism', 'Optics', 'Thermodynamics', 'Radioactivity'],
      Chemistry: ['Periodic Table', 'Chemical Reactions', 'Organic Chemistry'],
      Mathematics: ['Circles', 'Linear Equations', 'Quadratic Equations', 'Sets', 'Algebra', 'Probability']
    };

    function populateTopics() {
      const subject = document.getElementById('subject').value;
      const topicSelect = document.getElementById('topic');
      topicSelect.innerHTML = '<option value="">Select Topic</option>';

      if (subject) {
        topicSelect.disabled = false;
        subjectsTopics[subject].forEach(topic => {
          const option = document.createElement('option');
          option.value = topic;
          option.textContent = topic;
          topicSelect.appendChild(option);
        });
      } else {
        topicSelect.disabled = true;
      }
    }

    document.getElementById('subject').addEventListener('change', populateTopics);

    function fetchFilteredQuestions() {
      const subject = document.getElementById('subject').value;
      const topic = document.getElementById('topic').value;
      const level = document.getElementById('level').value;

      fetch(`/get_filtered_questions?subject=${subject}&topic=${topic}&level=${level}`)
        .then(res => res.json())
        .then(data => {
          const questionsList = document.getElementById('questionsList');
          questionsList.innerHTML = '';
          if (data.questions.length === 0) {
            questionsList.innerHTML = '<div class="alert alert-warning">No questions in the database</div>';
          } else {
            data.questions.forEach(q => {
              const qBlock = `
                <div class="form-check mb-2">
                  <input class="form-check-input" type="checkbox" name="questionIds" value="${q.id}" id="q${q.id}">
                  <label class="form-check-label" for="q${q.id}">
                    <strong>Q:</strong> ${q.question}<br>
                    <strong>Options:</strong> A) ${q.options.A}, B) ${q.options.B}, C) ${q.options.C}, D) ${q.options.D}
                  </label>
                </div>`;
              questionsList.insertAdjacentHTML('beforeend', qBlock);
            });
          }
          updateAssignButtonState();
        });
    }

    document.getElementById('questionForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const studentIds = Array.from(document.querySelectorAll('input[name="studentIds"]:checked')).map(cb => cb.value);
      if (studentIds.length === 0) {
        document.getElementById('studentError').style.display = 'block';
        return;
      } else {
        document.getElementById('studentError').style.display = 'none';
      }

      const questionIds = Array.from(document.querySelectorAll('input[name="questionIds"]:checked')).map(cb => cb.value);
      const subject = document.getElementById('subject').value;
      const topic = document.getElementById('topic').value;
      const level = document.getElementById('level').value;
      const numQuestions = document.getElementById('numQuestions').value;
      const timeLimit = document.getElementById('timeLimit').value;

      const response = await fetch('/generate_question', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ studentIds, questionIds, subject, topic, level, numQuestions, timeLimit })
      });

      const result = await response.json();
      document.getElementById('responseBox').innerHTML = `<div class="alert alert-success">✅ ${result.message || 'Test Assigned Successfully!'}</div>`;
      setTimeout(() => window.location.reload(), 1500);
    });

    function updateAssignButtonState() {
      const requiredCount = parseInt(document.getElementById('numQuestions').value);
      const selectedCount = document.querySelectorAll('input[name="questionIds"]:checked').length;
      const assignBtn = document.getElementById('assignBtn');
      assignBtn.disabled = (selectedCount !== requiredCount);
    }

    document.addEventListener('change', function(e) {
      if (e.target.name === 'questionIds') updateAssignButtonState();
    });

    document.getElementById('numQuestions').addEventListener('input', function() {
      document.querySelectorAll('input[name="questionIds"]').forEach(cb => cb.checked = false);
      updateAssignButtonState();
    });
  </script>
</body>
</html>
